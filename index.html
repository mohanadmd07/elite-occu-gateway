<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elite Hospital Occupancy Manager — Workspace Access</title>
    <meta
      name="description"
      content="Direct access gateway for Elite Hospital Occupancy Manager."
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('elite_hospital_theme_mode') || 'auto';
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'auto') {
            var cachedAuto = localStorage.getItem('elite_hospital_theme_auto_dark');
            if (cachedAuto === '1' || cachedAuto === '0') {
              isDark = cachedAuto === '1';
            } else {
              var parts = new Intl.DateTimeFormat('en-US', {
                hour: 'numeric',
                hour12: false,
                timeZone: 'Africa/Cairo',
              }).format(new Date());
              var h = Number(parts) % 24;
              isDark = h >= 18 || h < 6;
            }
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <main id="app" class="gateway-shell"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
